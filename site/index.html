<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a1e23">
  <title>Beaumont Timeline Builder</title>
  <meta name="description" content="Arrange the Beaumont Library District mural timeline: drag photographs from the collection onto the canvas, reorder, and export the approved sequence.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Libre+Franklin:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="timeline.css?v=10">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-plate" aria-hidden="true">BLD</span>
      <div class="brand-words">
        <span class="eyebrow">Library District Mural · Timeline Builder</span>
        <h1>Beaumont <em>in Pictures</em></h1>
      </div>
    </div>
    <div class="top-status" aria-live="polite">
      <span id="timelineStat">—</span>
      <span class="dirty-dot" id="dirtyDot" hidden title="Unsaved changes since last approval"></span>
      <span class="approved-note" id="approvedNote"></span>
    </div>
    <nav class="top-actions">
      <a class="ghost-link" href="research.html">Research workspace</a>
      <button class="btn ghost" id="revertBtn" type="button" title="Restore the last approved arrangement">Revert</button>
      <button class="btn outline" id="approveBtn" type="button" title="Save this arrangement as the approved timeline">Approve timeline</button>
      <button class="btn brass" id="exportBtn" type="button">Export document</button>
    </nav>
  </header>

  <main class="workspace">
    <section class="canvas-zone" aria-label="Timeline canvas">
      <div class="zone-head">
        <h2 class="zone-title">The Timeline</h2>
        <span class="zone-meta" id="canvasMeta"></span>
        <div class="zone-tools">
          <button class="tool-btn" id="sortBtn" type="button">Sort by date</button>
          <button class="tool-btn danger" id="clearBtn" type="button">Clear</button>
        </div>
      </div>
      <div class="canvas-row" id="canvasRow" aria-live="polite"></div>
    </section>

    <section class="tray-zone" aria-label="Photograph collection">
      <div class="tray-filters">
        <h2 class="zone-title tray-title">The Collection</h2>
        <label class="search-field">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg>
          <input id="searchInput" type="search" placeholder="Filter by keyword — people, places, signs, subjects…" autocomplete="off">
        </label>
        <label class="select-field"><span>Print</span>
          <select id="viabilityFilter">
            <option value="">All</option>
            <option>Production Ready</option>
            <option>Potentially Usable</option>
            <option>Reference Only</option>
          </select>
        </label>
        <label class="select-field"><span>Rights</span>
          <select id="rightsFilter">
            <option value="">All</option>
            <option>Public domain</option>
            <option>Permission required</option>
            <option>Copyrighted</option>
            <option>Unclear</option>
          </select>
        </label>
        <label class="check-field"><input id="hidePlaced" type="checkbox"><span>Hide placed</span></label>
        <span class="tray-count" id="trayCount" aria-live="polite"></span>
      </div>
      <div class="tray-row" id="trayRow"></div>
      <div class="scrubber" id="scrubber" aria-label="Scrub through the collection by decade">
        <div class="scrub-ticks" id="scrubTicks"></div>
        <div class="scrub-track" id="scrubTrack"><div class="scrub-handle" id="scrubHandle"></div></div>
      </div>
    </section>
  </main>

  <dialog id="quickView" class="quick-view">
    <button class="qv-close" type="button" data-close aria-label="Close">×</button>
    <div id="quickViewBody"></div>
  </dialog>

  <div class="desktop-gate" role="note">
    <p class="gate-mark" aria-hidden="true">BLD</p>
    <p>This timeline workspace is built for a desktop screen.<br>Please open it on a larger display.</p>
  </div>

  <div class="load-veil" id="loadVeil"><p>Opening the collection…</p></div>

  <script src="app.js?v=11" defer></script>
</body>
</html>
